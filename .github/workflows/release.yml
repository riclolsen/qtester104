name: Build release binaries

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0' # Qt 6.12 LTS

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Install headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../IEC104.pro CONFIG+=release CONFIG-=debug
          make -j"$(nproc)"
      - name: Protocol tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build-tests
          cd build-tests
          qmake ../tests/protocol_tests/protocol_tests.pro CONFIG+=release CONFIG-=debug
          make -j"$(nproc)"
          ./protocol_tests
      - name: Package with Qt runtime
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # The deploy tool's bundled strip may not understand newer ELF sections.
          NO_STRIP: '1'
        run: |
          curl --fail --location --retry 3 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum --check .github/packaging/linuxdeploy.sha256
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$(command -v qmake)"
          ./linuxdeploy-x86_64.AppImage --appdir QTester104 \
            --executable build/QTester104 --plugin qt \
            --desktop-file .github/packaging/QTester104.desktop \
            --icon-file .github/packaging/QTester104.svg
          # Avoid launching through a root-level executable symlink: Qt must
          # resolve its configuration relative to usr/bin on every supported version.
          rm -f QTester104/AppRun
          install -m 755 .github/packaging/AppRun QTester104/AppRun
          cp qtester104.ini QTester104/usr/bin/
          cp readme.txt License-gpl-3.0.txt QTester104/
          test -x QTester104/AppRun
          test -f QTester104/usr/plugins/tls/libqopensslbackend.so
          mkdir dist
          tar -czf dist/QTester104-linux-x86_64.tar.gz QTester104
      - name: Test extracted Linux package
        run: |
          mkdir smoke-package
          tar -xzf dist/QTester104-linux-x86_64.tar.gz -C smoke-package
          xvfb-run -a python3 .github/packaging/smoke-test.py smoke-package/QTester104/AppRun
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\IEC104.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
      - name: Package with Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package, dist | Out-Null
          Copy-Item build\QTester104.exe package\
          windeployqt --release --compiler-runtime --dir package package\QTester104.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (!(Test-Path package\tls\qschannelbackend.dll)) { throw "Missing Windows TLS backend" }
          if (!(Test-Path package\vc_redist.x64.exe)) { throw "Missing MSVC runtime installer" }
          Copy-Item .github\packaging\WINDOWS-README.txt package\README-FIRST.txt
          Copy-Item qtester104.ini, readme.txt, License-gpl-3.0.txt package\
          Compress-Archive -Path package\* -DestinationPath dist\QTester104-windows-x64.zip
      - name: Test extracted Windows package
        shell: pwsh
        run: |
          Expand-Archive dist\QTester104-windows-x64.zip smoke-package
          $installer = Start-Process -FilePath "$PWD\smoke-package\vc_redist.x64.exe" -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          # 1638 means a newer runtime is already installed; 3010 means reboot requested.
          if ($installer.ExitCode -notin @(0, 1638, 3010)) { throw "MSVC runtime installation failed: $($installer.ExitCode)" }
          python .github/packaging/smoke-test.py smoke-package/QTester104.exe
          if ($LASTEXITCODE -ne 0) { throw "Package startup test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-binaries'
          merge-multiple: true
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum QTester104-linux-x86_64.tar.gz QTester104-windows-x64.zip > SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" QTester104-linux-x86_64.tar.gz QTester104-windows-x64.zip SHA256SUMS.txt --clobber
          # Verify the uploaded bytes before publishing a new or retried draft.
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir" \
            --pattern QTester104-linux-x86_64.tar.gz \
            --pattern QTester104-windows-x64.zip --pattern SHA256SUMS.txt
          cmp SHA256SUMS.txt "$verify_dir/SHA256SUMS.txt"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
